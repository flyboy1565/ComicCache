services:
  backend:
    build: ./backend
    container_name: comiccache-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@comiccache.local}
      - DB_PATH=/data/comiccache.db
    volumes:
      - ./data:/data
    networks:
      - webproxy
      - default

  frontend:
    build: ./frontend
    container_name: comiccache-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - webproxy
      - default

networks:
  webproxy:
    external: true